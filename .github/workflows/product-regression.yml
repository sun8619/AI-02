name: Child learning regression
on: [push, pull_request]
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/release.mjs verify
      - run: npm test
      - run: node tools/deploy-regression-audit.mjs
